
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrator Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f3f7f5; }
        .login-card { max-width: 440px; margin: 8vh auto; border: 0; border-radius: 16px; box-shadow: 0 5px 24px #00000012; }
        .login-heading { color: #176b4d; }
    </style>
</head>
<body>
<div class="container">
    <div class="card login-card">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 login-heading fw-bold">Administrator Login</h1>
            <p class="text-muted">Sign in to manage complaints and review analytics.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-success w-100">Login</button>
            </form>

            <a href="{{ url_for('index') }}" class="btn btn-link mt-3 px-0">Back to home</a>
        </div>
    </div>
</div>
</body>
</html>
